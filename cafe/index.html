<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>만원 바리스타 · 영상 속 제품</title><meta name="robots" content="noindex">
<style>
:root{--accent:#8a5a3c;--bg:#f6f7f5;--card:#fff;--text:#1d2320;--muted:#6b736f}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1e2220;--text:#eef1ef;--muted:#a3aba7}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin:8px 0 16px}header .e{font-size:40px}h1{font-size:22px;margin:6px 0 4px}header p{margin:0;color:var(--muted);font-size:14px}
.ad{background:var(--card);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
.card{display:block;background:var(--card);border-radius:14px;padding:14px 16px;margin:10px 0;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.name{font-weight:700;font-size:16px}.price{margin-top:4px;font-size:14px;color:var(--muted)}.go{margin-top:8px;font-size:14px;font-weight:600;color:var(--accent)}
footer{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.6}
</style></head><body><main>
<header><div class="e">☕</div><h1>만원 바리스타</h1><p>만 원대로 꾸리는 홈카페 장비</p></header>
<div class="ad">[광고] 아래 링크는 알리익스프레스 제휴 링크로, 구매 시 일정 수수료를 받습니다. 최신 영상 제품이 맨 위에 있어요.</div>
<p>곧 제품이 올라옵니다.</p>
<footer>※ 가격은 영상 제작 시점 알리 판매가로, 옵션·쿠폰·환율에 따라 달라질 수 있어요. 할인율은 알리가 표시한 정가 기준입니다.<br>※ 해외직구 150달러 초과분은 관세·부가세가 따로 붙을 수 있어요.</footer>
</main></body></html>
